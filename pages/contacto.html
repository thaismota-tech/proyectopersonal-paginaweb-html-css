            <nav>
              <ul>

    <main>
        <section>
            <h1 class="contacto">¿Cómo contactarme para más información?</h1>
            <h2 class="solicitarcontacto">Ponte en contacto conmigo a través de este formulario:</h2> 
            
            <form action="/enviar-contacto" method="POST">
            <div>
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" required>
            </div>

        <div>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
        </div>

        <h3>¿En qué podemos ayudarte?</h3>
        
        <div>
            <label for="consultoria">Solicita nuestra consultoría gratis:</label>
            <input type="checkbox" id="consultoria" name="opcion" value="consultoria">
        </div>

         <div>
            <label for="mensaje">Tu mensaje:</label><br>
            <textarea id="mensaje" name="mensaje" rows="7" required></textarea>
        </div>

        <button type="submit">Enviar</button>

            </form>
        </section>
    </main>
